<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Fullshot Pro - Capturing…</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --border: #334155;
      --text: #f8fafc;
      --muted: #94a3b8;
      --accent: #4f46e5;
      --accent-hover: #4338ca;
      --stop: #059669;
      --stop-hover: #047857;
      --cancel: #dc2626;
      --cancel-hover: #b91c1c;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html, body {
      width: 100%;
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font: 12px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      user-select: none;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 14px 6px;
      border-bottom: 1px solid var(--border);
    }
    .header img {
      border-radius: 4px;
    }
    .header strong {
      font-size: 13px;
      font-weight: 700;
    }
    .header span {
      color: var(--muted);
      font-size: 11px;
      margin-left: auto;
    }
    .content {
      padding: 10px 14px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      flex: 1;
    }
    .status-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 12px;
    }
    .status-text {
      color: #a5b4fc;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .slice-info {
      color: var(--muted);
      font-size: 11px;
    }
    .progress-track {
      width: 100%;
      height: 7px;
      background: #1e293b;
      border-radius: 999px;
      overflow: hidden;
      border: 1px solid var(--border);
    }
    .progress-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #4f46e5, #818cf8);
      border-radius: 999px;
      transition: width 0.2s ease;
    }
    .buttons {
      display: flex;
      gap: 8px;
      margin-top: 4px;
    }
    button {
      font: inherit;
      font-size: 11px;
      font-weight: 600;
      border: none;
      border-radius: 6px;
      padding: 7px 10px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      transition: all 0.15s ease;
      flex: 1;
    }
    .btn-pause {
      background: #312e81;
      color: #e0e7ff;
      border: 1px solid #4f46e5;
    }
    .btn-pause:hover {
      background: #3730a3;
    }
    .btn-stop {
      background: var(--stop);
      color: #ffffff;
    }
    .btn-stop:hover {
      background: var(--stop-hover);
    }
    .btn-cancel {
      background: var(--cancel);
      color: #ffffff;
    }
    .btn-cancel:hover {
      background: var(--cancel-hover);
    }
    .hint-bar {
      padding: 4px 14px 8px;
      font-size: 10px;
      color: var(--muted);
      display: flex;
      justify-content: space-between;
    }
  </style>
</head>
<body>
  <div class="header">
    <img src="icons/icon-16.png" width="16" height="16" alt="">
    <strong>Fullshot Pro Capture</strong>
    <span id="headerStatus">Active</span>
  </div>
  <div class="content">
    <div class="status-row">
      <span class="status-text" id="statusText">📸 Capturing slices…</span>
      <span class="slice-info" id="sliceInfo">0%</span>
    </div>
    <div class="progress-track">
      <div class="progress-fill" id="progressFill"></div>
    </div>
    <div class="buttons">
      <button type="button" id="pauseBtn" class="btn-pause" title="Pause / Resume (Space)">
        <span id="pauseIcon">⏸️</span> <span id="pauseLabel">Pause</span>
      </button>
      <button type="button" id="stopBtn" class="btn-stop" title="Stop and open editor with current slices (Enter)">
        <span>⏹️</span> <span>Stop & View</span>
      </button>
      <button type="button" id="cancelBtn" class="btn-cancel" title="Cancel capture (Esc)">
        <span>✕</span> <span>Cancel</span>
      </button>
    </div>
  </div>
  <div class="hint-bar">
    <span>Space: Pause</span>
    <span>Enter: Stop &amp; View</span>
    <span>Esc: Cancel</span>
  </div>

  <script src="capture-controller.js"></script>
</body>
</html>
